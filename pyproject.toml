[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edu-context"
version = "0.1.0"
description = "Deterministic, task-aware compression of educational JSON tool results"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
token-audit = ["tiktoken"]

[tool.setuptools.packages.find]
include = ["edu_context*"]
