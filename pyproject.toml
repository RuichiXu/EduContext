[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edu-context"
version = "0.2.0"
description = "Task-aware JSON context compression with validated plans and exact evidence"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
token-audit = ["tiktoken"]

[tool.setuptools.packages.find]
include = ["edu_context*"]
